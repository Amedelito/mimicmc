# Oculta tu propio modelo a ti mismo (evita ver el interior del modelo en 1a persona)
ocultar-a-si-mismo: true

# Cada criatura es un ITEM con CustomModelData que tu resource pack convierte en modelo 3D.
# material: item base (el que sobreescribes en el resource pack)
# modelo: custom_model_data del modelo de la criatura
# modelo-mano: custom_model_data de la "patita" que se ve en 1a persona (0 = ninguna). Va en la mano secundaria (bloqueada)
# escala: tamano del modelo visible | escala-jugador: tamano real del jugador (hitbox/camara, 0.0625-16)
# altura: ajuste vertical extra (los modelos del pack ya vienen con los pies en el suelo, deja 0.0) | giro: grados para orientar el modelo hacia delante
# velocidad: multiplicador de velocidad | efectos: NOMBRE:nivel (0 = nivel I)
criaturas:
  nutria:
    material: PAPER
    modelo: 1001
    modelo-mano: 1101
    escala: 1.0
    escala-jugador: 0.45
    altura: 0.0
    giro: 0
    velocidad: 1.1
    efectos: ["dolphins_grace:0", "water_breathing:0"]
  capibara:
    material: PAPER
    modelo: 1002
    modelo-mano: 1102
