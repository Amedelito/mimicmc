def nutria():
    m=Model("nutria"); B,D,C,K="#7a5230","#4e3320","#d9c3a0","#1a1210"
    m.cube([5,3.5,3],[11,8,13],B); m.cube([5,2,3.5],[11,3.5,12.5],C)
    m.cube([5.5,4.5,0.5],[10.5,9.5,4.5],B); m.cube([6.5,4.5,0],[9.5,7,0.5],C)
    m.cube([7.3,6.2,-0.3],[8.7,7,0],K)
    m.mirror([6,7.6,0.2],[7,8.6,0.5],K)
    m.mirror([5.5,9.5,2.5],[6.7,10.6,3.7],D)
    for z in (3.5,10.5): m.mirror([5.5,0,z],[7.5,3,z+2],D)
    m.cube([6.5,3,13],[9.5,5.5,17],D); m.cube([7,3.3,17],[9,5,18.5],D)
    return m,(B,D,C,K)
def capibara():
    m=Model("capibara"); B,D,S,K="#a57c52","#7b5a3a","#8a6540","#1a1210"
    m.cube([4.5,3,3.5],[11.5,10,13.5],B); m.cube([5.5,5,0],[10.5,10,4.5],B)
    m.cube([6,5,-1.5],[10,8.5,0],S); m.cube([6.8,7,-1.8],[9.2,8.5,-1.5],K)
    m.mirror([5.3,8.2,1.2],[5.5,9.2,2.4],K); m.mirror([6,10,3],[7.2,11.2,4.2],D)
    for z in (4,11): m.mirror([5,0,z],[7,3,z+2],D)
    m.cube([7.5,6,13.5],[8.5,7,14.5],D)
    return m,(B,D,S,K)
def rana():
    m=Model("rana"); G,L,D,Y,K="#4ea23a","#a5d36b","#2f6e26","#e8c93a","#0b0b0b"
    m.cube([4.5,2.5,4],[11.5,6,12],G); m.cube([5,2,4.5],[11,2.5,11.5],L)
    m.cube([4,4,1],[12,7,5],G); m.cube([5,4.4,0.8],[11,5,1],D)
    m.mirror([4.5,7,2],[7,9.5,4.5],Y); m.mirror([5,7.5,1.8],[6.5,9,2],K)
    m.mirror([4,0,4.5],[5.5,2.5,6],D); m.mirror([3,0,9],[5,4,13],G); m.mirror([2.5,0,13],[5,1,15.5],D)
    return m,(G,L,D,Y)
def oso():
