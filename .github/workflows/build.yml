def hex2rgb(h): h=h.lstrip('#'); return tuple(int(h[i:i+2],16) for i in (0,2,4))
 
class Model:
    def __init__(self, name):
        self.name=name; self.el=[]; self.pal=[]
    def col(self,c):
        if c not in self.pal: self.pal.append(c)
        return self.pal.index(c)
    def cube(self,f,t,c):
        i=self.col(c); cx,cy=i%4,i//4
        uv=[cx*4,cy*4,cx*4+4,cy*4+4]
        face={"uv":uv,"texture":"#0"}
        self.el.append({"from":list(f),"to":list(t),
            "faces":{k:dict(face) for k in ("north","south","east","west","up","down")}})
    def mirror(self,f,t,c):
        self.cube(f,t,c)
        self.cube([16-t[0],f[1],f[2]],[16-f[0],t[1],t[2]],c)
    def texture(self):
        img=Image.new("RGBA",(16,16),(0,0,0,0)); rnd=random.Random(self.name)
        for i,c in enumerate(self.pal):
            r,g,b=hex2rgb(c); cx,cy=(i%4)*4,(i//4)*4
            for y in range(4):
                for x in range(4):
                    d=rnd.choice([-12,-6,0,0,0,6,12])
                    img.putpixel((cx+x,cy+y),(max(0,min(255,r+d)),max(0,min(255,g+d)),max(0,min(255,b+d)),255))
        return img
    def json(self, display):
        return {"textures":{"0":f"{NS}:item/{self.name}","particle":f"{NS}:item/{self.name}"},
                "texture_size":[16,16],"elements":self.el,"display":display}
 
