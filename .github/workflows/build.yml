def gato():
    m=Model("gato"); O,S,C,P,Gn="#d98a3d","#a8601d","#f2dfc0","#e89aa6","#6ad06a"
    m.cube([6,3,4],[10,7,12],O); m.cube([5.5,6,0.5],[10.5,10.5,4.5],O)
    m.mirror([5.5,10.5,2],[7,12.2,3.5],O); m.mirror([5.9,10.5,1.9],[6.8,11.5,2],P)
    m.mirror([6.2,7.6,0.3],[7.2,8.6,0.5],Gn); m.cube([7.6,6.8,0.3],[8.4,7.4,0.5],P)
    m.cube([6.7,5,0.3],[9.3,6.2,0.5],C)
    for z in (5.5,8.5,10.8): m.cube([6,7,z],[10,7.3,z+0.9],S)
    for z in (4.5,10): m.mirror([6,0,z],[7.6,3,z+1.6],S)
    m.cube([7.3,3.5,12],[8.7,4.8,15],O); m.cube([7.3,4.8,14],[8.7,10.5,15.4],S)
    return m,(O,S,C,P)
def conejo():
    m=Model("conejo"); W,G,P,K="#f1ece6","#bdb4ab","#f0a9b4","#0b0b0b"
    m.cube([5.5,3,5],[10.5,8,12],W); m.cube([5.5,5.5,1],[10.5,10,5],W)
    m.mirror([6,10,3],[7.3,16.5,4],W); m.mirror([6.4,10.5,2.9],[7,15.5,3],P)
