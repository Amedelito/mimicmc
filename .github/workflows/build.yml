def pinguino():
    m=Model("pinguino"); K,W,O,F="#1d2230","#f4f4f4","#f0a020","#2a3145"
    m.cube([4,2,5],[12,12,11],K); m.cube([4.5,2.5,4.6],[11.5,11.5,5],W)
    m.cube([5,12,5],[11,16,11],K); m.cube([7,12.8,3.8],[9,14,5],O)
    m.mirror([5.6,14,4.8],[6.8,15.2,5],W); m.mirror([6.1,14.2,4.7],[6.7,15,4.8],K)
    m.mirror([2.5,4,5.5],[4,10.5,10.5],F)
    m.mirror([5,0,3.5],[7.5,1,6.5],O); m.cube([7.2,2,11],[8.8,3,12.5],K)
    return m,(K,W,O,F)
 
def paw(name,pal):
    fur,dark,light,acc=pal
    m=Model(name+"_mano")
    m.cube([6,0,6],[10,11,10],fur); m.cube([5.5,10,5.5],[10.5,15,10.5],light if name in("nutria","capibara","gato","oso") else fur)
    m.cube([7.1,10.5,10.5],[7.5,15,10.7],dark); m.cube([8.5,10.5,10.5],[8.9,15,10.7],dark)
    m.cube([6,15,8.5],[7.2,16.2,10],acc); m.cube([8.8,15,8.5],[10,16.2,10],acc); m.cube([7.4,15,8.5],[8.6,16.2,10],acc)
    return m
 
if os.path.exists(OUT): shutil.rmtree(OUT)
for d in ("models/item","textures/item"): os.makedirs(f"{OUT}/assets/{NS}/{d}")
os.makedirs(f"{OUT}/assets/minecraft/models/item")
overrides=[]; models={}
for fn in (nutria,capibara,rana,oso,gato,conejo,pinguino):
    m,pal=fn(); n=m.name; p=paw(n,pal)
    for mod,disp,cmd in ((m,BODY_DISPLAY,BASE_CMD[n]),(p,PAW_DISPLAY,BASE_CMD[n]+PAW_OFFSET)):
        json.dump(mod.json(disp),open(f"{OUT}/assets/{NS}/models/item/{mod.name}.json","w"),indent=1)
        mod.texture().save(f"{OUT}/assets/{NS}/textures/item/{mod.name}.png")
        overrides.append({"predicate":{"custom_model_data":cmd},"model":f"{NS}:item/{mod.name}"})
        models[mod.name]=mod
json.dump({"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/paper"},"overrides":overrides},
          open(f"{OUT}/assets/minecraft/models/item/paper.json","w"),indent=1)
json.dump({"pack":{"pack_format":34,"description":"Mimic - criaturas custom"}},open(f"{OUT}/pack.mcmeta","w"),indent=1)
 
# ---- zip + sha1
z="MimicPack.zip"
with zipfile.ZipFile(z,"w",zipfile.ZIP_DEFLATED) as zf:
    for r,_,fs in os.walk(OUT):
        for f in fs:
            p=os.path.join(r,f); zf.write(p,os.path.relpath(p,OUT))
print("sha1",hashlib.sha1(open(z,"rb").read()).hexdigest())
 
# ---- preview (render simple)
def render(mod,size=260):
    img=Image.new("RGB",(size,size),(48,52,60)); dr=ImageDraw.Draw(img)
    ph,pt=math.radians(-35),math.radians(25)
    def tr(p):
        x,y,z=p[0]-8,p[1]-8,p[2]-8
        x,z=x*math.cos(ph)-z*math.sin(ph), x*math.sin(ph)+z*math.cos(ph)
        y,z=y*math.cos(pt)-z*math.sin(pt), y*math.sin(pt)+z*math.cos(pt)
        return x,y,z
    faces=[]
    nrm={"north":(0,0,-1),"south":(0,0,1),"west":(-1,0,0),"east":(1,0,0),"up":(0,1,0),"down":(0,-1,0)}
    for e in mod.el:
        f,t=e["from"],e["to"]; x0,y0,z0=f; x1,y1,z1=t
        V={"north":[(x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0)],"south":[(x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1)],
           "west":[(x0,y0,z0),(x0,y0,z1),(x0,y1,z1),(x0,y1,z0)],"east":[(x1,y0,z0),(x1,y0,z1),(x1,y1,z1),(x1,y1,z0)],
           "up":[(x0,y1,z0),(x1,y1,z0),(x1,y1,z1),(x0,y1,z1)],"down":[(x0,y0,z0),(x1,y0,z0),(x1,y0,z1),(x0,y0,z1)]}
        uv=e["faces"]["north"]["uv"]; i=(uv[1]//4)*4+uv[0]//4; c=hex2rgb(mod.pal[i])
        for k,vs in V.items():
            n=nrm[k]; nx,ny,nz=n; 
            ntr=tr((nx+8,ny+8,nz+8)); o=tr((8,8,8)); nv=(ntr[0]-o[0],ntr[1]-o[1],ntr[2]-o[2])
            if nv[2]>0.05: continue   # cara trasera (camara en -z)
            pts=[tr(v) for v in vs]; zc=sum(p[2] for p in pts)/4
            sh=0.55+0.45*max(0,(-nv[2]*0.5+nv[1]*0.6+0.2))
            faces.append((zc,[(size/2+p[0]*size/26,size/2-p[1]*size/26+size*0.05) for p in pts],tuple(int(min(255,v*sh)) for v in c)))
    for zc,pts,c in sorted(faces,key=lambda a:-a[0]): dr.polygon(pts,fill=c)
    return img
