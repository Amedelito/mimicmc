    m.cube([4,4,4],[12,12,14],B); m.cube([5,7,0],[11,13,5],B)
    m.cube([6.5,7,-1.5],[9.5,10,0],L); m.cube([7.3,9,-1.8],[8.7,10,-1.5],K)
    m.mirror([6,10.5,0],[7,11.7,0.2],K)
